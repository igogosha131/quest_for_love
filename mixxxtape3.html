 <!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Страница голоса — демо</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Marck+Script&family=Manrope:wght@400;500;600;700&family=Amatic+SC:wght@700&display=swap" rel="stylesheet">
<!-- если CDN не откроется, замени на https://unpkg.com/wavesurfer.js@7 -->
<script src="https://unpkg.com/wavesurfer.js@7/dist/wavesurfer.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0}
  body{min-height:100vh;display:flex;flex-direction:column;align-items:center;
       background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;
       transition:background .5s,color .5s;position:relative;overflow-x:hidden}

  /* ---------- ТЕМЫ ---------- */
  body[data-theme="minimal"]{--bg:#ffffff;--ink:#141414;--accent:#141414;--wave:#14141422;--glowc:#14141412;--head:'Caveat';--panel:#ffffffcc;--panelb:#00000014;--cbody:#1c1c1c;--label:#f7f3ea;--labelink:#141414;--tape:#654a30}
  body[data-theme="warm"]   {--bg:#f3e9d7;--ink:#54402e;--accent:#8a5a33;--wave:#8a5a3333;--glowc:#ffd9a066;--head:'Marck Script';--panel:#f3e9d7cc;--panelb:#54402e1a;--cbody:#5b4632;--label:#fbf6ec;--labelink:#54402e;--tape:#7a5230}
  body[data-theme="night"]  {--bg:#0f1418;--ink:#eaf7f5;--accent:#3ee6cf;--wave:#eaf7f522;--glowc:#3ee6cf40;--head:'Caveat';--panel:#141b20cc;--panelb:#eaf7f51a;--cbody:#080b0d;--label:#1d2a30;--labelink:#eaf7f5;--tape:#8a6a4a}
  body[data-theme="retro"]  {--bg:#e8dcc3;--ink:#3d3226;--accent:#b4552d;--wave:#b4552d33;--glowc:#b4552d33;--head:'Amatic SC';--panel:#e8dcc3cc;--panelb:#3d32261a;--cbody:#7a4a2b;--label:#f4ead6;--labelink:#3d3226;--tape:#654a30}
  body[data-theme="fest"]   {--bg:#fbf7f0;--ink:#2b2b2b;--accent:#c29a5b;--wave:#c29a5b33;--glowc:#ffd98860;--head:'Marck Script';--panel:#fbf7f0cc;--panelb:#2b2b2b16;--cbody:#2b2b2b;--label:#fffdf8;--labelink:#2b2b2b;--tape:#8a6a45}

  /* мягкое дышащее свечение фона */
  body::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(ellipse 60% 40% at 50% 8%, var(--glowc), transparent 65%);
    opacity:.8;animation:breathe 7s ease-in-out infinite;transition:background .5s;
  }
  @keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}

  /* ---------- панель настроек (демо-режим) ---------- */
  .panel{position:fixed;top:14px;left:50%;transform:translate(-50%,-140%);z-index:10;
         width:min(400px,calc(100% - 24px));
         background:var(--panel);border:1px solid var(--panelb);border-radius:22px;
         backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
         box-shadow:0 12px 30px -14px rgba(0,0,0,.28);
         padding:14px;display:flex;flex-direction:column;gap:10px;
         animation:panelDrop .7s cubic-bezier(.16,1,.3,1) .1s forwards;}
  @keyframes panelDrop{to{transform:translate(-50%,0)}}
  body.preview .panel{transform:translate(-50%,-140%)!important}
  body.panel-hide .panel{transform:translate(-50%,-140%)!important}

  .panel-section{background:var(--panelb);border-radius:14px;padding:10px 11px;display:flex;flex-direction:column;gap:9px}
  .panel-label{font-size:10px;letter-spacing:.09em;text-transform:uppercase;opacity:.5;font-weight:600}

  .theme-set{display:flex;gap:5px;flex-wrap:wrap}
  .theme-pill{display:flex;align-items:center;gap:6px;border:1px solid transparent;background:var(--bg);
              color:var(--ink);border-radius:999px;padding:5px 11px 5px 8px;cursor:pointer;
              font-family:Manrope;font-size:12px;font-weight:500;opacity:.65;
              transition:opacity .25s,background .25s,border-color .25s}
  .theme-pill:hover{opacity:.9}
  .theme-pill.active{opacity:1;background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .theme-pill .dot{width:8px;height:8px;border-radius:50%;background:var(--pc);flex:0 0 auto;
                    box-shadow:0 0 0 2px color-mix(in srgb, var(--pc) 30%, transparent)}
  .theme-pill.active .dot{box-shadow:0 0 0 2px color-mix(in srgb, var(--bg) 55%, transparent)}

  .panel-controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;row-gap:10px}

  .toggle{display:flex;align-items:center;gap:7px;cursor:pointer;font-size:12px;color:var(--ink);opacity:.85}
  .toggle input{position:absolute;opacity:0;width:0;height:0}
  .toggle .track{width:30px;height:18px;border-radius:999px;background:var(--bg);position:relative;
                  transition:background .25s;flex:0 0 auto;box-shadow:inset 0 0 0 1px var(--panelb)}
  .toggle .track::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;
                         background:var(--ink);opacity:.5;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .25s cubic-bezier(.4,0,.2,1),opacity .2s}
  .toggle input:checked + .track{background:var(--accent)}
  .toggle input:checked + .track::after{transform:translateX(12px);background:var(--bg);opacity:1}

  .pfile{display:flex;align-items:center;gap:6px;border:1px dashed var(--panelb);border-radius:999px;
         padding:5px 12px;cursor:pointer;font-size:12px;color:var(--ink);opacity:.75;transition:opacity .2s,border-color .2s;background:var(--bg)}
  .pfile:hover{opacity:1;border-color:var(--accent)}
  .pfile input{display:none}

  .ppreview{border:none;background:var(--accent);color:var(--bg);font-weight:600;
            border-radius:999px;padding:10px 16px;font-size:13px;cursor:pointer;letter-spacing:.01em;
            transition:transform .15s,filter .2s;width:100%}
  .ppreview:hover{filter:brightness(1.08)}
  .ppreview:active{transform:scale(.96)}

  /* ---------- плавающая кнопка заказа: видна и в настройках, и в предпросмотре ---------- */
  .order-fab{position:fixed;bottom:18px;right:16px;z-index:15;border:none;background:var(--accent);color:var(--bg);
             font-weight:600;font-size:12.5px;border-radius:999px;padding:11px 18px;cursor:pointer;
             display:flex;align-items:center;gap:6px;box-shadow:0 12px 28px -12px rgba(0,0,0,.4);
             transition:transform .15s,filter .2s;animation:fabIn .6s cubic-bezier(.16,1,.3,1) .4s both}
  .order-fab:hover{filter:brightness(1.08)}
  .order-fab:active{transform:scale(.94)}
  @keyframes fabIn{from{opacity:0;transform:translateY(10px) scale(.9)}to{opacity:1;transform:translateY(0) scale(1)}}

  /* ---------- предпросмотр ---------- */
  .exitbtn{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(140%);z-index:20;
           border:1px solid var(--panelb);background:var(--panel);color:var(--ink);border-radius:999px;
           padding:9px 16px;font-size:12.5px;cursor:pointer;backdrop-filter:blur(14px);
           box-shadow:0 8px 22px -12px rgba(0,0,0,.3);
           transition:transform .35s cubic-bezier(.16,1,.3,1)}
  body.preview .exitbtn{transform:translateX(-50%) translateY(0)}
  body.preview .page{padding-top:88px}

  /* ---------- страница ---------- */
  .page{width:min(430px,100%);padding:150px 24px 40px;text-align:center;position:relative;z-index:1;
        transition:padding-top .35s}
  .topicon{width:30px;height:30px;opacity:.6;margin-bottom:14px}
  .names{font-family:var(--head),cursive;font-size:36px;font-weight:500;line-height:1.15}
  .date{margin-top:6px;font-size:14px;letter-spacing:.06em;opacity:.65}
  [contenteditable]:focus{outline:1.5px dashed var(--accent);outline-offset:5px;border-radius:4px}

  /* ---------- вход элементов ---------- */
  .page > *{opacity:0;animation:riseIn .8s cubic-bezier(.16,1,.3,1) forwards}
  .page .topicon{animation-delay:.05s}
  .page .names{animation-delay:.16s}
  .page .date{animation-delay:.26s}
  .page .cassette{animation:cassetteIn 1s cubic-bezier(.16,1,.3,1) forwards;animation-delay:.36s}
  .page .wave-row{animation-delay:.6s}
  .page .transport{animation-delay:.72s}
  .page .time{animation-delay:.8s}
  .page .msg{animation-delay:.9s}
  .page footer{animation-delay:1s}
  @keyframes riseIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  @keyframes cassetteIn{
    0%{opacity:0;transform:scale(.82) rotate(-4deg)}
    62%{opacity:1;transform:scale(1.035) rotate(1deg)}
    100%{opacity:1;transform:scale(1) rotate(0)}
  }

  /* ---------- кассета ---------- */
  .cassette{margin:26px auto 4px;cursor:pointer;user-select:none}
  .cassette svg{width:min(320px,100%);filter:drop-shadow(0 12px 32px var(--glowc));transition:filter .4s}
  .cassette rect,.cassette circle,.cassette path,.cassette text,.cassette line{transition:fill .4s,stroke .4s}
  .reel{transform-box:fill-box;transform-origin:center;animation:spin 1.8s linear infinite;animation-play-state:paused}
  body.playing .reel{animation-play-state:running}
  body.fast .reel{animation-play-state:running;animation-duration:.22s}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---------- плеер ---------- */
  .wave-row{margin:22px auto 4px;width:100%;display:flex;align-items:center;gap:12px;transition:max-width .35s ease,gap .3s}
  body.has-cassette .wave-row{max-width:260px}
  #wave{flex:1;min-width:0}
  .wave-row .tbtn{flex:0 0 auto}

  .transport{display:flex;justify-content:center;align-items:center;gap:16px;margin:14px 0 8px}
  .tbtn{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--accent);background:transparent;color:var(--ink);
        display:grid;place-items:center;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;transition:transform .12s}
  .tbtn:active{transform:scale(.9)}
  .play{width:64px;height:64px;border-radius:50%;border:none;cursor:pointer;
        display:grid;place-items:center;background:var(--accent);color:var(--bg);
        box-shadow:0 10px 28px var(--glowc);transition:transform .15s;visibility:hidden}
  body.show-play .play{visibility:visible}
  .play:active{transform:scale(.94)}
  .i-pause{display:none}
  body.playing .i-pause{display:block}
  body.playing .i-play{display:none}
  .time{font-size:12px;opacity:.6;letter-spacing:.08em}
  .msg{margin:26px auto 0;max-width:320px;font-family:var(--head),cursive;font-size:22px;line-height:1.4}
  footer{margin-top:34px;font-size:12px;opacity:.5;letter-spacing:.02em}

  /* ---------- окно заказа ---------- */
  .order-overlay{position:fixed;inset:0;z-index:100;background:rgba(10,10,10,.45);backdrop-filter:blur(10px);
    display:none;align-items:center;justify-content:center;padding:20px}
  .order-overlay.open{display:flex;opacity:1;animation:overlayIn .25s ease forwards}
  @keyframes overlayIn{from{opacity:0}to{opacity:1}}

  .order-card{position:relative;background:var(--panel);border:1px solid var(--panelb);color:var(--ink);
    padding:26px 22px 20px;border-radius:22px;width:min(420px,100%);max-height:90vh;overflow-y:auto;
    display:flex;flex-direction:column;gap:16px;box-shadow:0 24px 60px -20px rgba(0,0,0,.4);
    backdrop-filter:blur(16px);animation:cardIn .35s cubic-bezier(.16,1,.3,1)}
  @keyframes cardIn{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}

  .order-close{position:absolute;top:14px;right:14px;width:28px;height:28px;border:none;background:var(--panelb);
    color:var(--ink);border-radius:50%;cursor:pointer;font-size:16px;line-height:1;display:grid;place-items:center;
    opacity:.7;transition:opacity .2s}
  .order-close:hover{opacity:1}

  .order-head{display:flex;gap:12px;align-items:flex-start;padding-right:24px}
  .order-icon{font-size:26px;line-height:1}
  .order-head h3{font-size:17px;font-weight:600;margin:0 0 3px}
  .order-head p{font-size:12.5px;opacity:.65;margin:0;line-height:1.4}

  .order-fields{display:flex;flex-direction:column;gap:12px}
  .ofield{display:flex;flex-direction:column;gap:5px;font-size:11px;opacity:.55;letter-spacing:.03em;text-transform:uppercase;font-weight:600}
  .ofield input,.ofield textarea{font:inherit;font-size:14px;text-transform:none;letter-spacing:normal;font-weight:400;
    padding:10px 12px;border:1px solid var(--panelb);border-radius:12px;background:transparent;color:var(--ink);transition:border-color .2s}
  .ofield input:focus,.ofield textarea:focus{outline:none;border-color:var(--accent)}
  .ofield textarea{resize:vertical;min-height:60px}

  .order-actions{display:flex;gap:10px;margin-top:2px}
  .obtn{flex:1;padding:11px;border-radius:12px;font-size:13.5px;font-weight:600;cursor:pointer;transition:transform .15s,filter .2s}
  .obtn:active{transform:scale(.97)}
  .obtn.ghost{border:1px solid var(--panelb);background:transparent;color:var(--ink)}
  .obtn.solid{border:none;background:var(--accent);color:var(--bg)}
  .obtn.solid:hover{filter:brightness(1.08)}

  .order-status{font-size:12px;opacity:.65;text-align:center;margin:0;display:none}
  .order-status.show{display:block}

  @media (prefers-reduced-motion: reduce){
    .page > *,.page .cassette,.panel,.exitbtn,.order-fab,.order-overlay.open,.order-card,body::before{animation:none!important;opacity:1!important;transform:none!important}
  }
</style>
</head>
<body data-theme="minimal">

<div class="panel">
  <div class="panel-section">
    <span class="panel-label">тема оформления</span>
    <div class="theme-set">
      <button data-theme="minimal" class="theme-pill active" style="--pc:#141414"><span class="dot"></span>минимал</button>
      <button data-theme="warm" class="theme-pill" style="--pc:#8a5a33"><span class="dot"></span>тёплый</button>
      <button data-theme="night" class="theme-pill" style="--pc:#3ee6cf"><span class="dot"></span>ночь</button>
      <button data-theme="retro" class="theme-pill" style="--pc:#b4552d"><span class="dot"></span>ретро</button>
      <button data-theme="fest" class="theme-pill" style="--pc:#c29a5b"><span class="dot"></span>праздник</button>
    </div>
  </div>
  <div class="panel-section">
    <span class="panel-label">опции страницы</span>
    <div class="panel-controls">
      <label class="pfile">загрузить аудио<input type="file" id="file" accept="audio/*"></label>
      <label class="toggle"><input type="checkbox" id="showCassette" checked><span class="track"></span>кассета</label>
      <label class="toggle"><input type="checkbox" id="showFilter"><span class="track"></span>звук кассеты</label>
      <label class="toggle"><input type="checkbox" id="showPlay"><span class="track"></span>кнопка play</label>
    </div>
  </div>
  <button id="previewBtn" class="ppreview">предпросмотр →</button>
</div>

<button id="orderFab" class="order-fab">🛒 Оформить заказ</button>
<button id="exitPreview" class="exitbtn">← к настройкам</button>

<div id="orderModal" class="order-overlay">
  <form id="orderForm" class="order-card">
    <button type="button" id="closeOrderX" class="order-close" aria-label="закрыть">×</button>
    <div class="order-head">
      <span class="order-icon">🎁</span>
      <div>
        <h3>Оформить заказ</h3>
        <p>Оставьте контакты — мы свяжемся и уточним детали печати</p>
      </div>
    </div>
    <div class="order-fields">
      <label class="ofield">имя<input name="name" placeholder="Как к вам обращаться" required></label>
      <label class="ofield">телефон<input name="phone" placeholder="+7 ..." required></label>
      <label class="ofield">email<input name="email" placeholder="необязательно"></label>
      <label class="ofield">комментарий<textarea name="comment" rows="3" placeholder="Пожелания к кассете"></textarea></label>
    </div>
    <div class="order-actions">
      <button type="button" id="cancelOrder" class="obtn ghost">Отмена</button>
      <button type="submit" class="obtn solid">Отправить</button>
    </div>
    <p id="orderStatus" class="order-status"></p>
  </form>
</div>

<main class="page">
  <svg class="topicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
    <rect x="2" y="5" width="20" height="14" rx="2"/><circle cx="8.5" cy="12" r="2"/><circle cx="15.5" cy="12" r="2"/><path d="M8.5 14.5h7"/>
  </svg>

  <h1 class="names" data-field="names" contenteditable spellcheck="false">Маша и Илья</h1>
  <div class="date" data-field="date" contenteditable spellcheck="false">12 октября 2024</div>

  <!-- КАССЕТА -->
  <div class="cassette" id="cassette" title="нажми — играет">
    <svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg">
      <rect x="2.5" y="2.5" width="315" height="195" rx="15.5" fill="var(--cbody)" stroke="#000"/>
      <rect x="10" y="10" width="300" height="180" rx="12" fill="none" stroke="#fff" stroke-opacity=".15"/>
      <rect x="28" y="22" width="268" height="130" rx="10" fill="var(--label)"/>
      <text x="44" y="47" fill="var(--labelink)" font-family="Manrope" font-size="12" letter-spacing="4" font-weight="700">SIDE A</text>
      <text x="276" y="47" text-anchor="end" fill="var(--labelink)" opacity=".55" font-family="Manrope" font-size="10">mixtape.ru</text>
      <line x1="44" y1="56" x2="276" y2="56" stroke="var(--labelink)" opacity=".25"/>
      <rect x="75" y="63" width="173" height="67" rx="10" fill="#181512" stroke="#000" stroke-opacity=".4"/>
      <path id="tapePath" d="" stroke="var(--tape)" stroke-width="4" fill="none" stroke-linecap="round"/>
      <circle id="packL" cx="125" cy="97" r="28" fill="var(--tape)" stroke="#000" stroke-opacity=".4"/>
      <g class="reel">
        <circle cx="125" cy="97" r="12" fill="var(--label)"/>
        <g fill="var(--labelink)" fill-opacity=".75">
          <rect x="122" y="86" width="6" height="22" rx="2"/>
          <rect x="122" y="86" width="6" height="22" rx="2" transform="rotate(60 125 97)"/>
          <rect x="122" y="86" width="6" height="22" rx="2" transform="rotate(120 125 97)"/>
        </g>
        <circle cx="125" cy="97" r="4" fill="var(--labelink)" fill-opacity=".85"/>
      </g>
      <circle id="packR" cx="195" cy="97" r="12" fill="var(--tape)" stroke="#000" stroke-opacity=".4"/>
      <g class="reel">
        <circle cx="195" cy="97" r="12" fill="var(--label)"/>
        <g fill="var(--labelink)" fill-opacity=".75">
          <rect x="192" y="86" width="6" height="22" rx="2"/>
          <rect x="192" y="86" width="6" height="22" rx="2" transform="rotate(60 195 97)"/>
          <rect x="192" y="86" width="6" height="22" rx="2" transform="rotate(120 195 97)"/>
        </g>
        <circle cx="195" cy="97" r="4" fill="var(--labelink)" fill-opacity=".85"/>
      </g>
      <g opacity=".35" fill="#727272">
        <circle cx="20" cy="20" r="4"/><circle cx="300" cy="20" r="4"/>
        <circle cx="20" cy="180" r="4"/><circle cx="300" cy="180" r="4"/>
      </g>
      <g stroke="#000" stroke-width="1.2">
        <path d="M17.5 20H22.5M20 17.5V22.5"/>
        <path d="M297.5 20H302.5M300 17.5V22.5"/>
        <path d="M17.5 180H22.5M20 177.5V182.5"/>
        <path d="M297.5 180H302.5M300 177.5V182.5"/>
      </g>
      <path d="M60.5 198.5L75.5 160.5H250L265.5 198.5Z" fill="var(--cbody)" stroke="#000" stroke-opacity=".35" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M62.5 197.1L76.5 162.4H249L263.5 197.5" stroke="#fff" stroke-opacity=".15" stroke-width=".7" fill="none"/>
      <g fill="#727272" opacity=".3">
        <rect x="122" y="173" width="8" height="8" rx="1"/>
        <rect x="190" y="173" width="8" height="8" rx="1"/>
        <circle cx="95.5" cy="180.5" r="4.5"/>
        <circle cx="223" cy="181" r="4"/>
      </g>
    </svg>
  </div>

  <div class="wave-row" id="waveRow">
    <div id="wave"></div>
  </div>

  <div class="transport" id="transport">
    <button id="rew" class="tbtn" aria-label="перемотка назад">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M19 7l-7 5 7 5zM12 7l-7 5 7 5z"/></svg>
    </button>
    <button id="play" class="play" aria-label="play/pause">
      <svg class="i-play"  width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      <svg class="i-pause" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
    </button>
    <button id="ff" class="tbtn" aria-label="перемотка вперёд">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M5 7l7 5-7 5zM12 7l7 5-7 5z"/></svg>
    </button>
  </div>

  <div class="time"><span id="cur">0:00</span> / <span id="tot">0:00</span></div>

  <p class="msg" data-field="msg" contenteditable spellcheck="false">С годовщиной! Это песня нашего первого танца ♥</p>
  <footer>создать свою историю →</footer>
</main>

<script>
  const $ = s => document.querySelector(s);
  const body = document.body;
  let ws = null, dur = 0;

  const fmt = t => { t = Math.round(t || 0); return Math.floor(t/60) + ':' + String(t%60).padStart(2,'0'); };
  const themeVars = () => {
    const cs = getComputedStyle(body);
    return { wave: cs.getPropertyValue('--wave').trim(), accent: cs.getPropertyValue('--accent').trim() };
  };

  /* ---------- тексты ---------- */
  const DEFAULTS = {
    minimal: { names:'Маша и Илья',        date:'12 октября 2024',        msg:'С годовщиной! Это песня нашего первого танца ♥' },
    warm:    { names:'Мама и папа',        date:'1 июня 1998',            msg:'Двадцать пять лет вместе — и это только начало…' },
    night:   { names:'Кирилл и Вера',      date:'ночь, 14 августа 2025',  msg:'Твой голос — мой любимый трек' },
    retro:   { names:'Семья Ковалёвых',    date:'лето 1987',              msg:'Из семейного архива, с любовью' },
    fest:    { names:'Аня и Максим',       date:'день свадьбы, 07.07.2026', msg:'Песня, с которой у нас всё началось' },
  };
  const custom = { names:null, date:null, msg:null };
  document.querySelectorAll('[contenteditable]').forEach(el => {
    el.addEventListener('input', () => { custom[el.dataset.field] = el.textContent; });
  });
  function applyTexts(theme){
    document.querySelectorAll('[contenteditable]').forEach(el => {
      const f = el.dataset.field;
      el.textContent = custom[f] !== null ? custom[f] : DEFAULTS[theme][f];
    });
  }

  /* ---------- лента ---------- */
  const R_MIN = 12, R_MAX = 28, CY = 97, LX = 125, RX = 195;
  let curP = 0, playing = false, phase = 0;
  function tapeD(p, w){
    p = Math.max(0, Math.min(1, p || 0));
    const rl = R_MIN + (R_MAX - R_MIN) * (1 - p);
    const rr = R_MIN + (R_MAX - R_MIN) * p;
    $('#packL').setAttribute('r', rl.toFixed(2));
    $('#packR').setAttribute('r', rr.toFixed(2));
    return `M ${LX} ${(CY + rl - 1).toFixed(2)} C 145 ${(128 + w).toFixed(2)}, 175 ${(128 - w * .7).toFixed(2)}, ${RX} ${(CY + rr - 1).toFixed(2)}`;
  }
  const drawTape = w => $('#tapePath').setAttribute('d', tapeD(curP, w || 0));
  drawTape(0);
  (function loop(){
    if (playing || body.classList.contains('fast')){ phase += 0.11; drawTape(Math.sin(phase) * 1.2 + Math.sin(phase * 2.3) * 0.5); }
    requestAnimationFrame(loop);
  })();

  /* ---------- звук кассеты ---------- */
  let actx = null, graph = null;
  const ensureCtx = () => { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); return actx; };
  const noiseBuffer = (ctx, secs) => { const b = ctx.createBuffer(1, ctx.sampleRate * (secs || 2), ctx.sampleRate); const d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; return b; };
  const satCurve = () => { const n = 1024, c = new Float32Array(n); for (let i = 0; i < n; i++){ const x = i / n * 2 - 1; c[i] = Math.tanh(1.6 * x) / Math.tanh(1.6); } return c; };
  const filterOn = () => $('#showFilter').checked;

  function playClick(bright){
    const ctx = ensureCtx(), t = ctx.currentTime;
    const len = Math.floor(ctx.sampleRate * 0.045);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (len * 0.14));
    const src = ctx.createBufferSource(); src.buffer = buf;
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = bright ? 2200 : 1400; bp.Q.value = .8;
    const g = ctx.createGain(); g.gain.value = .3;
    src.connect(bp).connect(g).connect(ctx.destination);
    src.start(t);
  }

  function scheduleCrackle(myGraph){
    const delay = 500 + Math.random() * 2600;
    myGraph.crackleTimer = setTimeout(() => {
      if (graph === myGraph){
        if (filterOn() && playing){
          const ctx = actx, t = ctx.currentTime;
          const len = Math.floor(ctx.sampleRate * 0.01);
          const buf = ctx.createBuffer(1, len, ctx.sampleRate);
          const d = buf.getChannelData(0);
          for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (len * 0.35));
          const src = ctx.createBufferSource(); src.buffer = buf;
          const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 2200;
          const g = ctx.createGain(); g.gain.value = 0.018 + Math.random() * 0.02;
          src.connect(hp).connect(g).connect(ctx.destination);
          src.start(t);
        }
        scheduleCrackle(myGraph);
      }
    }, delay);
  }

  function stopGraph(){
    if (!graph) return;
    clearTimeout(graph.crackleTimer);
    [...graph.oscs, graph.hiss].forEach(n => { try { n.stop(); } catch(e){} });
    graph = null;
  }
  function buildGraph(el){
    const ctx = ensureCtx(); stopGraph();
    const src  = ctx.createMediaElementSource(el);
    const dry  = ctx.createGain(); dry.gain.value = 1;
    const wet  = ctx.createGain(); wet.gain.value = 0;
    const hp = ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=110;
    const lp = ctx.createBiquadFilter(); lp.type='lowpass';  lp.frequency.value=7200; lp.Q.value=.5;
    const pk = ctx.createBiquadFilter(); pk.type='peaking';  pk.frequency.value=2000; pk.gain.value=2; pk.Q.value=.8;
    const sh = ctx.createWaveShaper(); sh.curve = satCurve(); sh.oversample='2x';
    src.connect(dry).connect(ctx.destination);
    src.connect(hp); hp.connect(lp); lp.connect(pk); pk.connect(sh); sh.connect(wet); wet.connect(ctx.destination);

    const hiss = ctx.createBufferSource(); hiss.buffer = noiseBuffer(ctx, 3); hiss.loop = true;
    const hf1 = ctx.createBiquadFilter(); hf1.type='highpass'; hf1.frequency.value=4200;
    const hf2 = ctx.createBiquadFilter(); hf2.type='lowpass';  hf2.frequency.value=11000;
    const hg = ctx.createGain(); hg.gain.value=0;
    const hLfo = ctx.createOscillator(); hLfo.frequency.value=.35;
    const hLfoG = ctx.createGain(); hLfoG.gain.value=.003; hLfo.connect(hLfoG); hLfo.start();
    hiss.connect(hf1); hf1.connect(hf2); hf2.connect(hg); hg.connect(ctx.destination);
    hiss.start();

    graph = { el, dry, wet, hg, hgBase:0.011, hLfoG, oscs:[hLfo], hiss };
    applyFilterState();
    scheduleCrackle(graph);
  }
  function applyFilterState(){
    if (!graph) return;
    const on = filterOn(), t = actx.currentTime;
    graph.wet.gain.setTargetAtTime(on ? 1 : 0, t, .05);
    graph.dry.gain.setTargetAtTime(on ? 0 : 1, t, .05);
    graph.hg.gain.setTargetAtTime(on && playing ? graph.hgBase : 0, t, .12);
  }
  $('#showFilter').onchange = () => {
    ensureCtx();
    if (filterOn() && ws && !graph) buildGraph(ws.getMediaElement());
    if (filterOn()) playClick(true);
    applyFilterState();
  };

  /* ---------- перемотка ---------- */
  let whine = null, stepInt = null, wasPlaying = false;
  function startWhine(dir){
    const ctx = ensureCtx(); stopWhine();
    const src = ctx.createBufferSource(); src.buffer = noiseBuffer(ctx); src.loop = true;
    const bp  = ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value = dir > 0 ? 1100 : 850; bp.Q.value=1.4;
    const bp2 = ctx.createBiquadFilter(); bp2.type='bandpass'; bp2.frequency.value = dir > 0 ? 2600 : 2100; bp2.Q.value=2;
    const g = ctx.createGain(); g.gain.value=0;
    const lfo = ctx.createOscillator(); lfo.frequency.value = dir > 0 ? 13 : 9;
    const lg = ctx.createGain(); lg.gain.value=140; lfo.connect(lg).connect(bp.frequency); lfo.start();
    src.connect(bp).connect(g); src.connect(bp2).connect(g); g.connect(ctx.destination);
    g.gain.setTargetAtTime(0.035, ctx.currentTime, .03);
    src.start(); whine = { src, g, lfo };
  }
  function stopWhine(){
    if (!whine) return;
    const { src, g, lfo } = whine;
    g.gain.setTargetAtTime(0, actx.currentTime, .04);
    setTimeout(() => { try { src.stop(); lfo.stop(); } catch(e){} }, 250);
    whine = null;
  }
  function holdSeek(dir){
    if (!ws) return;
    playClick(dir > 0);
    const el = ws.getMediaElement();
    wasPlaying = !el.paused;
    startWhine(dir);
    body.classList.add('fast');
    el.playbackRate = 4;
    el.play();
    if (dir < 0){
      stepInt = setInterval(() => { el.currentTime = Math.max(0, el.currentTime - 0.6); }, 110);
    }
  }
  function endSeek(dir){
    if (!ws) return;
    const el = ws.getMediaElement();
    stopWhine(); body.classList.remove('fast');
    if (dir < 0){ clearInterval(stepInt); stepInt = null; }
    el.playbackRate = 1;
    if (wasPlaying) el.play(); else el.pause();
  }
  [['#rew', -1], ['#ff', 1]].forEach(([sel, dir]) => {
    const b = $(sel);
    b.addEventListener('pointerdown', e => { e.preventDefault(); holdSeek(dir); });
    ['pointerup','pointerleave','pointercancel'].forEach(ev => b.addEventListener(ev, () => endSeek(dir)));
    b.addEventListener('contextmenu', e => e.preventDefault());
  });

  /* ---------- wavesurfer ---------- */
  function makeWs(url){
    if (ws) ws.destroy();
    stopGraph();
    dur = 0; curP = 0; drawTape(0);
    const t = themeVars();
    ws = WaveSurfer.create({
      container:'#wave', url, height:76,
      barWidth:2, barGap:2, barRadius:2, cursorWidth:1, normalize:true,
      waveColor:t.wave, progressColor:t.accent,
    });
    if (filterOn()) buildGraph(ws.getMediaElement());
    ws.on('play',  () => { playing = true;  body.classList.add('playing'); applyFilterState(); });
    ws.on('pause', () => { playing = false; body.classList.remove('playing'); drawTape(0); applyFilterState(); });
    ws.on('finish',() => { playing = false; body.classList.remove('playing'); drawTape(0); applyFilterState(); });
    ws.on('decode', d => { dur = d; $('#tot').textContent = fmt(d); });
    const onTime = t => { $('#cur').textContent = fmt(t); if (dur > 0){ curP = t / dur; if (!playing) drawTape(0); } };
    ws.on('timeupdate', onTime);
    ws.on('seeking',    onTime);
  }

  const toggle = () => ws ? ws.playPause() : $('#file').click();
  $('#play').onclick = toggle;
  $('#cassette').onclick = toggle;
  $('#file').onchange = e => { const f = e.target.files[0]; if (f) makeWs(URL.createObjectURL(f)); };

  /* темы */
  document.querySelectorAll('.theme-pill').forEach(b => b.onclick = () => {
    body.dataset.theme = b.dataset.theme;
    document.querySelectorAll('.theme-pill').forEach(x => x.classList.toggle('active', x === b));
    applyTexts(b.dataset.theme);
    if (ws) { const t = themeVars(); ws.setOptions({ waveColor:t.wave, progressColor:t.accent }); }
  });

  /* кассета / кнопка play */
  function applyPlayVis(){ body.classList.toggle('show-play', $('#showPlay').checked); }

  function layoutTransport(){
    const split = !$('#showPlay').checked;
    const waveRow = $('#waveRow'), transport = $('#transport');
    const rewEl = $('#rew'), playEl = $('#play'), ffEl = $('#ff');
    waveRow.classList.toggle('split', split);
    if (split){
      waveRow.insertBefore(rewEl, $('#wave'));
      waveRow.appendChild(ffEl);
      transport.style.display = 'none';
    } else {
      transport.insertBefore(rewEl, playEl);
      transport.appendChild(ffEl);
      transport.style.display = '';
    }
  }

  function setCassette(on){
    $('#cassette').style.display = on ? '' : 'none';
    body.classList.toggle('has-cassette', on);
    if (!on && !$('#showPlay').checked) $('#showPlay').checked = true;
    applyPlayVis();
    layoutTransport();
  }
  $('#showCassette').onchange = e => setCassette(e.target.checked);
  $('#showPlay').onchange = () => { applyPlayVis(); layoutTransport(); };
  setCassette(true);

  /* предпросмотр */
  function setPreview(on){
    body.classList.toggle('preview', on);
    document.querySelectorAll('[contenteditable]').forEach(el => el.contentEditable = on ? 'false' : 'true');
  }
  $('#previewBtn').onclick  = () => setPreview(true);
  $('#exitPreview').onclick = () => setPreview(false);

  /* ---------- окно заказа ---------- */
  const orderFab = document.getElementById('orderFab');
  const orderModal = document.getElementById('orderModal');
  const orderForm = document.getElementById('orderForm');
  const orderStatus = document.getElementById('orderStatus');

  function openOrder(){
    orderModal.classList.add('open');
    body.classList.add('panel-hide'); // прячем панель настроек, если она была открыта
  }
  function closeOrder(){
    orderModal.classList.remove('open');
    body.classList.remove('panel-hide');
  }
  orderFab.onclick = openOrder;
  document.getElementById('cancelOrder').onclick = closeOrder;
  document.getElementById('closeOrderX').onclick = closeOrder;
  orderModal.addEventListener('click', e => { if (e.target === orderModal) closeOrder(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && orderModal.classList.contains('open')) closeOrder(); });

  // ========== TELEGRAM ==========
  const TG_BOT_TOKEN = '7952957041:AAFr6Hh1CVJEGh9gK854riLuDds5jwQYnSg';
  const TG_CHAT_ID = '810079994';
  const TG_PROXY = 'https://ha-tg-proxy.igogosha13.workers.dev';

  async function tgRequest(method, body, isFormData = false) {
    const url = `${TG_PROXY}/bot${TG_BOT_TOKEN}/${method}`;
    const options = {
      method: 'POST',
      body: isFormData ? body : JSON.stringify(body),
    };
    if (!isFormData) {
      options.headers = { 'Content-Type': 'application/json' };
    }
    return fetch(url, options);
  }

  function collectOrderData(){
    const formData = new FormData(orderForm);
    return {
      customer: {
        name: formData.get('name'),
        phone: formData.get('phone'),
        email: formData.get('email'),
        comment: formData.get('comment'),
      },
      product: {
        theme: body.dataset.theme,
        texts: {
          names: document.querySelector('[data-field="names"]').textContent,
          date: document.querySelector('[data-field="date"]').textContent,
          msg: document.querySelector('[data-field="msg"]').textContent,
        },
        options: {
          cassette: $('#showCassette').checked,
          filter: $('#showFilter').checked,
          playButton: $('#showPlay').checked,
        },
        hasAudio: !!ws && !!ws.getMediaElement().src,
      },
      timestamp: new Date().toISOString(),
    };
  }

  orderForm.onsubmit = async (e) => {
    e.preventDefault();
    orderStatus.classList.add('show');
    orderStatus.textContent = 'Отправляем заказ...';

    try {
      const data = collectOrderData();

      const message = `
🎁 *НОВЫЙ ЗАКАЗ*

👤 *Контакты:*
Имя: ${data.customer.name}
Телефон: ${data.customer.phone}
Email: ${data.customer.email || '—'}
Комментарий: ${data.customer.comment || '—'}

🎨 *Продукт:*
Тема: ${data.product.theme}
Имена: ${data.product.texts.names}
Дата: ${data.product.texts.date}
Посвящение: ${data.product.texts.msg}

⚙️ *Настройки:*
Кассета: ${data.product.options.cassette ? '✓' : '✗'}
Звук кассеты: ${data.product.options.filter ? '✓' : '✗'}
Кнопка play: ${data.product.options.playButton ? '✓' : '✗'}

⏰ ${new Date().toLocaleString('ru-RU')}
      `.trim();

      await tgRequest('sendMessage', {
        chat_id: TG_CHAT_ID,
        text: message,
        parse_mode: 'Markdown',
      });

      if (data.product.hasAudio) {
        orderStatus.textContent = 'Загружаем аудио...';
        const audioEl = ws.getMediaElement();
        const res = await fetch(audioEl.src);
        const blob = await res.blob();
        const file = new File([blob], `order_${Date.now()}.mp3`, { type: blob.type });

        const formData = new FormData();
        formData.append('chat_id', TG_CHAT_ID);
        formData.append('document', file);
        formData.append('caption', `🔊 Аудио к заказу от ${data.customer.name}`);

        await tgRequest('sendDocument', formData, true);
      }

      orderStatus.textContent = '✓ Заказ отправлен! Мы свяжемся с вами.';
      setTimeout(() => {
        closeOrder();
        orderStatus.classList.remove('show');
        orderForm.reset();
      }, 2500);

    } catch (err) {
      console.error(err);
      orderStatus.textContent = '✗ Ошибка отправки. Попробуйте ещё раз.';
    }
  };
</script>
</body>
