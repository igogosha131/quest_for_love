<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fudio Memories</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Marck+Script&family=Manrope:wght@400;500;700&family=Amatic+SC:wght@700&display=swap" rel="stylesheet">
<!-- если CDN не откроется, замени на https://unpkg.com/wavesurfer.js@7 -->
<script src="https://unpkg.com/wavesurfer.js@7/dist/wavesurfer.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0}
  body{min-height:100vh;display:flex;flex-direction:column;align-items:center;
       background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;
       transition:background .4s,color .4s}

  /* ---------- ТЕМЫ (правь здесь) ---------- */
  body[data-theme="minimal"]{--bg:#ffffff;--ink:#141414;--accent:#141414;--wave:#14141422;--glowc:transparent;--head:'Caveat';--panel:#ffffffee;--label:#f7f3ea;--labelink:#141414;--cbody:#1c1c1c}
  body[data-theme="warm"]   {--bg:#f3e9d7;--ink:#54402e;--accent:#8a5a33;--wave:#8a5a3333;--glowc:#ffd9a055;--head:'Marck Script';--panel:#f3e9d7ee;--label:#fbf6ec;--labelink:#54402e;--cbody:#5b4632}
  body[data-theme="night"]  {--bg:#0f1418;--ink:#eaf7f5;--accent:#3ee6cf;--wave:#eaf7f522;--glowc:#3ee6cf44;--head:'Caveat';--panel:#0f1418ee;--label:#1d2a30;--labelink:#eaf7f5;--cbody:#080b0d}
  body[data-theme="retro"]  {--bg:#e8dcc3;--ink:#3d3226;--accent:#b4552d;--wave:#b4552d33;--glowc:transparent;--head:'Amatic SC';--panel:#e8dcc3ee;--label:#f4ead6;--labelink:#3d3226;--cbody:#7a4a2b}
  body[data-theme="fest"]   {--bg:#fbf7f0;--ink:#2b2b2b;--accent:#c29a5b;--wave:#c29a5b33;--glowc:#ffd98855;--head:'Marck Script';--panel:#fbf7f0ee;--label:#fffdf8;--labelink:#2b2b2b;--cbody:#2b2b2b}

  /* ---------- панель демо ---------- */
  .panel{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;flex-wrap:wrap;gap:6px;
         justify-content:center;align-items:center;padding:8px 10px;font-size:12px;background:var(--panel);backdrop-filter:blur(8px)}
  .panel button{border:1px solid var(--accent);background:none;color:var(--ink);border-radius:999px;padding:4px 10px;cursor:pointer;font-size:12px}
  .panel button.active{background:var(--accent);color:var(--bg)}
  .ppreview{background:var(--accent);color:var(--bg);border:none;font-weight:700}
  .pfile{border:1px dashed var(--accent);border-radius:999px;padding:4px 10px;cursor:pointer}
  .pfile input{display:none}
  .pcheck{display:flex;gap:4px;align-items:center}

  /* ---------- режим предпросмотра ---------- */
  .exitbtn{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:20;display:none;
           border:1px solid var(--accent);background:var(--panel);color:var(--ink);border-radius:999px;
           padding:8px 14px;font-size:12px;cursor:pointer;backdrop-filter:blur(8px)}
  body.preview .panel{display:none}
  body.preview .exitbtn{display:block}
  body.preview .page{padding-top:48px}

  /* ---------- страница ---------- */
  .page{width:min(430px,100%);padding:84px 24px 40px;text-align:center}
  .topicon{width:30px;height:30px;opacity:.7;margin-bottom:14px}
  .names{font-family:var(--head),cursive;font-size:36px;font-weight:500;line-height:1.15}
  .date{margin-top:6px;font-size:14px;letter-spacing:.12em;opacity:.7}
  [contenteditable]:focus{outline:1.5px dashed var(--accent);outline-offset:5px;border-radius:4px}

  /* ---------- кассета ---------- */
  .cassette{margin:26px auto 4px;cursor:pointer;user-select:none}
  .cassette svg{width:min(320px,100%);filter:drop-shadow(0 12px 32px var(--glowc));transition:filter .4s}
  .reel{transform-box:fill-box;transform-origin:center;animation:spin 1.8s linear infinite;animation-play-state:paused}
  body.playing .reel{animation-play-state:running}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---------- плеер ---------- */
  #wave{margin:22px auto 4px;width:100%;transition:max-width .35s ease}
  body.has-cassette #wave{max-width:260px}   /* кассета есть → волна узкая; нет → на всю ширину */
  .play{width:64px;height:64px;border-radius:50%;border:none;cursor:pointer;margin:14px auto 8px;
        display:grid;place-items:center;background:var(--accent);color:var(--bg);
        box-shadow:0 10px 28px var(--glowc);transition:transform .15s}
  .play:active{transform:scale(.94)}
  .i-pause{display:none}
  body.playing .i-pause{display:block}
  body.playing .i-play{display:none}
  .time{font-size:12px;opacity:.6;letter-spacing:.08em}
  .msg{margin:26px auto 0;max-width:320px;font-family:var(--head),cursive;font-size:22px;line-height:1.4}
  footer{margin-top:34px;font-size:12px;opacity:.5;letter-spacing:.06em}
</style>
</head>
<body data-theme="minimal">

<div class="panel">
  <span>демо · тема:</span>
  <button data-theme="minimal" class="active">минимал</button>
  <button data-theme="warm">тёплый</button>
  <button data-theme="night">ночь</button>
  <button data-theme="retro">ретро</button>
  <button data-theme="fest">праздник</button>
  <label class="pfile">загрузить аудио<input type="file" id="file" accept="audio/*"></label>
  <label class="pcheck"><input type="checkbox" id="showCassette" checked>кассета</label>
  <button id="previewBtn" class="ppreview">предпросмотр</button>
</div>

<button id="exitPreview" class="exitbtn">← к настройкам</button>

<main class="page">
  <svg class="topicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
    <rect x="2" y="5" width="20" height="14" rx="2"/><circle cx="8.5" cy="12" r="2"/><circle cx="15.5" cy="12" r="2"/><path d="M8.5 14.5h7"/>
  </svg>

  <h1 class="names" contenteditable spellcheck="false">Маша и Илья</h1>
  <div class="date" contenteditable spellcheck="false">12 октября 2024</div>

  <!-- КАССЕТА: клик = play/pause, катушки крутятся при воспроизведении -->
  <div class="cassette" id="cassette" title="нажми — играет">
    <svg viewBox="0 0 320 200">
      <rect x="2" y="2" width="316" height="196" rx="16" fill="var(--cbody)"/>
      <rect x="10" y="10" width="300" height="180" rx="12" fill="none" stroke="#ffffff22"/>
      <rect x="28" y="22" width="264" height="112" rx="10" fill="var(--label)"/>
      <text x="44" y="47" fill="var(--labelink)" font-family="Manrope" font-size="12" letter-spacing="4" font-weight="700">SIDE A</text>
      <text x="276" y="47" text-anchor="end" fill="var(--labelink)" opacity=".55" font-family="Manrope" font-size="10">mixtape.ru</text>
      <line x1="44" y1="56" x2="276" y2="56" stroke="var(--labelink)" opacity=".25"/>
      <rect x="110" y="70" width="100" height="52" rx="8" fill="#000" fill-opacity=".55"/>
      <path d="M135 114 C150 121 170 121 185 114" stroke="#000" stroke-opacity=".5" fill="none" stroke-width="3"/>
      <g class="reel">
        <circle cx="135" cy="96" r="17" fill="var(--label)"/>
        <g fill="#000" fill-opacity=".7">
          <rect x="132" y="80" width="6" height="32" rx="3"/>
          <rect x="132" y="80" width="6" height="32" rx="3" transform="rotate(60 135 96)"/>
          <rect x="132" y="80" width="6" height="32" rx="3" transform="rotate(120 135 96)"/>
        </g>
        <circle cx="135" cy="96" r="6" fill="#000" fill-opacity=".8"/>
      </g>
      <g class="reel">
        <circle cx="185" cy="96" r="17" fill="var(--label)"/>
        <g fill="#000" fill-opacity=".7">
          <rect x="182" y="80" width="6" height="32" rx="3"/>
          <rect x="182" y="80" width="6" height="32" rx="3" transform="rotate(60 185 96)"/>
          <rect x="182" y="80" width="6" height="32" rx="3" transform="rotate(120 185 96)"/>
        </g>
        <circle cx="185" cy="96" r="6" fill="#000" fill-opacity=".8"/>
      </g>
      <circle cx="20" cy="20" r="4" fill="#000" opacity=".4"/><circle cx="300" cy="20" r="4" fill="#000" opacity=".4"/>
      <circle cx="20" cy="180" r="4" fill="#000" opacity=".4"/><circle cx="300" cy="180" r="4" fill="#000" opacity=".4"/>
    </svg>
  </div>

  <div id="wave"></div>
  <button id="play" class="play" aria-label="play/pause">
    <svg class="i-play"  width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    <svg class="i-pause" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
  </button>
  <div class="time"><span id="cur">0:00</span> / <span id="tot">0:00</span></div>

  <p class="msg" contenteditable spellcheck="false">С годовщиной! Это песня нашего первого танца ♥</p>
  <footer>создать свою историю →</footer>
</main>

<script>
  const $ = s => document.querySelector(s);
  const body = document.body;
  let ws = null;

  const fmt = t => { t = Math.round(t || 0); return Math.floor(t/60) + ':' + String(t%60).padStart(2,'0'); };
  const themeVars = () => {
    const cs = getComputedStyle(body);
    return { wave: cs.getPropertyValue('--wave').trim(), accent: cs.getPropertyValue('--accent').trim() };
  };

  function makeWs(url){
    if (ws) ws.destroy();
    const t = themeVars();
    ws = WaveSurfer.create({
      container:'#wave', url, height:76,
      barWidth:2, barGap:2, barRadius:2, cursorWidth:1, normalize:true,
      waveColor:t.wave, progressColor:t.accent,
    });
    ws.on('play',  () => body.classList.add('playing'));
    ws.on('pause', () => body.classList.remove('playing'));
    ws.on('finish',() => body.classList.remove('playing'));
    ws.on('timeupdate', t => $('#cur').textContent = fmt(t));
    ws.on('decode',     d => $('#tot').textContent = fmt(d));
  }

  const toggle = () => ws ? ws.playPause() : $('#file').click();
  $('#play').onclick = toggle;
  $('#cassette').onclick = toggle;

  $('#file').onchange = e => {
    const f = e.target.files[0];
    if (f) makeWs(URL.createObjectURL(f));
  };

  /* темы */
  document.querySelectorAll('[data-theme]').forEach(b => b.onclick = () => {
    body.dataset.theme = b.dataset.theme;
    document.querySelectorAll('[data-theme]').forEach(x => x.classList.toggle('active', x === b));
    if (ws) { const t = themeVars(); ws.setOptions({ waveColor:t.wave, progressColor:t.accent }); }
  });

  /* кассета вкл/выкл + ширина волны */
  function setCassette(on){
    $('#cassette').style.display = on ? '' : 'none';
    body.classList.toggle('has-cassette', on);
  }
  $('#showCassette').onchange = e => setCassette(e.target.checked);
  setCassette(true);

  /* предпросмотр: прячем панель, выключаем редактирование */
  function setPreview(on){
    body.classList.toggle('preview', on);
    document.querySelectorAll('[contenteditable]').forEach(el => el.contentEditable = on ? 'false' : 'true');
  }
  $('#previewBtn').onclick  = () => setPreview(true);
  $('#exitPreview').onclick = () => setPreview(false);
</script>
</body>
</html>
