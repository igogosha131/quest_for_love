<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Бесконечно люблю!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Marck+Script&family=Manrope:wght@400;500;600;700&family=Amatic+SC:wght@700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/wavesurfer.js@7/dist/wavesurfer.min.js"></script>

<script>
// ╔══════════════════════════════════════════════════╗
// ║  НАСТРОЙКИ ЗАКАЗА — МЕНЯЙ ТОЛЬКО ЭТО            ║
// ╚══════════════════════════════════════════════════╝

const ORDER = {
  theme:    'retro',                                    // minimal | warm | night | retro | fest
  names:    'Forever and always',                                // имена
  date:     '20.08.2020 - ထ',                            // дата
  message:  'Любимая, поздравляю тебя с нашей годвщиной!', // посвящение
  audio:    'audio.mp3',                                  // имя файла (положи рядом с index.html)
  cassette: true,                                         // true = показать кассету, false = скрыть
  filter:   false,                                        // true = звук кассеты (тёплый фильтр)
  playBtn:  false,                                        // true = показать круглую кнопку play
};
</script>

<style>
  *{box-sizing:border-box;margin:0}
  body{min-height:100vh;display:flex;flex-direction:column;align-items:center;
       background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;
       transition:background .5s,color .5s;position:relative;overflow-x:hidden}

  body[data-theme="minimal"]{--bg:#ffffff;--ink:#141414;--accent:#141414;--wave:#14141422;--glowc:#14141412;--head:'Caveat';--cbody:#1c1c1c;--label:#f7f3ea;--labelink:#141414;--tape:#654a30}
  body[data-theme="warm"]   {--bg:#f3e9d7;--ink:#54402e;--accent:#8a5a33;--wave:#8a5a3333;--glowc:#ffd9a066;--head:'Marck Script';--cbody:#5b4632;--label:#fbf6ec;--labelink:#54402e;--tape:#7a5230}
  body[data-theme="night"]  {--bg:#0f1418;--ink:#eaf7f5;--accent:#3ee6cf;--wave:#eaf7f522;--glowc:#3ee6cf40;--head:'Caveat';--cbody:#080b0d;--label:#1d2a30;--labelink:#eaf7f5;--tape:#8a6a4a}
  body[data-theme="retro"]  {--bg:#e8dcc3;--ink:#3d3226;--accent:#b4552d;--wave:#b4552d33;--glowc:#b4552d33;--head:'Amatic SC';--cbody:#7a4a2b;--label:#f4ead6;--labelink:#3d3226;--tape:#654a30}
  body[data-theme="fest"]   {--bg:#fbf7f0;--ink:#2b2b2b;--accent:#c29a5b;--wave:#c29a5b33;--glowc:#ffd98860;--head:'Marck Script';--cbody:#2b2b2b;--label:#fffdf8;--labelink:#2b2b2b;--tape:#8a6a45}

  body::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(ellipse 60% 40% at 50% 8%, var(--glowc), transparent 65%);
    opacity:.8;animation:breathe 7s ease-in-out infinite;transition:background .5s;
  }
  @keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}

  .page{width:min(430px,100%);padding:60px 24px 40px;text-align:center;position:relative;z-index:1}
  .topicon{width:30px;height:30px;opacity:.6;margin-bottom:14px}
  .names{font-family:var(--head),cursive;font-size:36px;font-weight:500;line-height:1.15}
  .date{margin-top:6px;font-size:14px;letter-spacing:.06em;opacity:.65}

  .page > *{opacity:0;animation:riseIn .8s cubic-bezier(.16,1,.3,1) forwards}
  .page .topicon{animation-delay:.05s}
  .page .names{animation-delay:.16s}
  .page .date{animation-delay:.26s}
  .page .cassette{animation:cassetteIn 1s cubic-bezier(.16,1,.3,1) forwards;animation-delay:.36s}
  .page .wave-row{animation-delay:.6s}
  .page .transport{animation-delay:.72s}
  .page .time{animation-delay:.8s}
  .page .msg{animation-delay:.9s}
  .page footer{animation-delay:1s}
  @keyframes riseIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  @keyframes cassetteIn{0%{opacity:0;transform:scale(.82) rotate(-4deg)}62%{opacity:1;transform:scale(1.035) rotate(1deg)}100%{opacity:1;transform:scale(1) rotate(0)}}

  .cassette{margin:26px auto 4px;cursor:pointer;user-select:none}
  .cassette svg{width:min(320px,100%);filter:drop-shadow(0 12px 32px var(--glowc));transition:filter .4s}
  .cassette rect,.cassette circle,.cassette path,.cassette text,.cassette line{transition:fill .4s,stroke .4s}
  .reel{transform-box:fill-box;transform-origin:center;animation:spin 1.8s linear infinite;animation-play-state:paused}
  body.playing .reel{animation-play-state:running}
  body.fast .reel{animation-play-state:running;animation-duration:.22s}
  @keyframes spin{to{transform:rotate(360deg)}}

  .wave-row{margin:22px auto 4px;width:100%;display:flex;align-items:center;gap:12px;transition:max-width .35s ease}
  body.has-cassette .wave-row{max-width:260px}
  #wave{flex:1;min-width:0}
  .wave-row .tbtn{flex:0 0 auto}

  .transport{display:flex;justify-content:center;align-items:center;gap:16px;margin:14px 0 8px}
  .tbtn{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--accent);background:transparent;color:var(--ink);
        display:grid;place-items:center;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;transition:transform .12s}
  .tbtn:active{transform:scale(.9)}
  .play{width:64px;height:64px;border-radius:50%;border:none;cursor:pointer;
        display:grid;place-items:center;background:var(--accent);color:var(--bg);
        box-shadow:0 10px 28px var(--glowc);transition:transform .15s;visibility:hidden}
  body.show-play .play{visibility:visible}
  .play:active{transform:scale(.94)}
  .i-pause{display:none}
  body.playing .i-pause{display:block}
  body.playing .i-play{display:none}
  .time{font-size:12px;opacity:.6;letter-spacing:.08em}
  .msg{margin:26px auto 0;max-width:320px;font-family:var(--head),cursive;font-size:22px;line-height:1.4}
  footer{margin-top:34px}
  footer a{font-size:12px;opacity:.5;letter-spacing:.02em;color:var(--ink);text-decoration:none;transition:opacity .2s}
  footer a:hover{opacity:.8}

  @media(prefers-reduced-motion:reduce){.page > *,.page .cassette,body::before{animation:none!important;opacity:1!important;transform:none!important}}
</style>
</head>
<body>

<main class="page">
  <svg class="topicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
    <rect x="2" y="5" width="20" height="14" rx="2"/><circle cx="8.5" cy="12" r="2"/><circle cx="15.5" cy="12" r="2"/><path d="M8.5 14.5h7"/>
  </svg>

  <h1 class="names"></h1>
  <div class="date"></div>

  <div class="cassette" id="cassette" title="нажми — играет">
    <svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg">
      <rect x="2.5" y="2.5" width="315" height="195" rx="15.5" fill="var(--cbody)" stroke="#000"/>
      <rect x="10" y="10" width="300" height="180" rx="12" fill="none" stroke="#fff" stroke-opacity=".15"/>
      <rect x="28" y="22" width="268" height="130" rx="10" fill="var(--label)"/>
      <text x="44" y="47" fill="var(--labelink)" font-family="Manrope" font-size="12" letter-spacing="4" font-weight="700">SIDE A</text>
      <text x="276" y="47" text-anchor="end" fill="var(--labelink)" opacity=".55" font-family="Manrope" font-size="10">mixtape.ru</text>
      <line x1="44" y1="56" x2="276" y2="56" stroke="var(--labelink)" opacity=".25"/>
      <rect x="75" y="63" width="173" height="67" rx="10" fill="#181512" stroke="#000" stroke-opacity=".4"/>
      <path id="tapePath" d="" stroke="var(--tape)" stroke-width="4" fill="none" stroke-linecap="round"/>
      <circle id="packL" cx="125" cy="97" r="28" fill="var(--tape)" stroke="#000" stroke-opacity=".4"/>
      <g class="reel"><circle cx="125" cy="97" r="12" fill="var(--label)"/>
        <g fill="var(--labelink)" fill-opacity=".75">
          <rect x="122" y="86" width="6" height="22" rx="2"/>
          <rect x="122" y="86" width="6" height="22" rx="2" transform="rotate(60 125 97)"/>
          <rect x="122" y="86" width="6" height="22" rx="2" transform="rotate(120 125 97)"/>
        </g><circle cx="125" cy="97" r="4" fill="var(--labelink)" fill-opacity=".85"/>
      </g>
      <circle id="packR" cx="195" cy="97" r="12" fill="var(--tape)" stroke="#000" stroke-opacity=".4"/>
      <g class="reel"><circle cx="195" cy="97" r="12" fill="var(--label)"/>
        <g fill="var(--labelink)" fill-opacity=".75">
          <rect x="192" y="86" width="6" height="22" rx="2"/>
          <rect x="192" y="86" width="6" height="22" rx="2" transform="rotate(60 195 97)"/>
          <rect x="192" y="86" width="6" height="22" rx="2" transform="rotate(120 195 97)"/>
        </g><circle cx="195" cy="97" r="4" fill="var(--labelink)" fill-opacity=".85"/>
      </g>
      <g opacity=".35" fill="#727272">
        <circle cx="20" cy="20" r="4"/><circle cx="300" cy="20" r="4"/>
        <circle cx="20" cy="180" r="4"/><circle cx="300" cy="180" r="4"/>
      </g>
      <g stroke="#000" stroke-width="1.2">
        <path d="M17.5 20H22.5M20 17.5V22.5"/><path d="M297.5 20H302.5M300 17.5V22.5"/>
        <path d="M17.5 180H22.5M20 177.5V182.5"/><path d="M297.5 180H302.5M300 177.5V182.5"/>
      </g>
      <path d="M60.5 198.5L75.5 160.5H250L265.5 198.5Z" fill="var(--cbody)" stroke="#000" stroke-opacity=".35" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M62.5 197.1L76.5 162.4H249L263.5 197.5" stroke="#fff" stroke-opacity=".15" stroke-width=".7" fill="none"/>
      <g fill="#727272" opacity=".3">
        <rect x="122" y="173" width="8" height="8" rx="1"/><rect x="190" y="173" width="8" height="8" rx="1"/>
        <circle cx="95.5" cy="180.5" r="4.5"/><circle cx="223" cy="181" r="4"/>
      </g>
    </svg>
  </div>

  <div class="wave-row" id="waveRow"><div id="wave"></div></div>

  <div class="transport" id="transport">
    <button id="rew" class="tbtn" aria-label="перемотка назад">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M19 7l-7 5 7 5zM12 7l-7 5 7 5z"/></svg>
    </button>
    <button id="play" class="play" aria-label="play/pause">
      <svg class="i-play" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      <svg class="i-pause" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
    </button>
    <button id="ff" class="tbtn" aria-label="перемотка вперёд">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M5 7l7 5-7 5zM12 7l7 5-7 5z"/></svg>
    </button>
  </div>

  <div class="time"><span id="cur">0:00</span> / <span id="tot">0:00</span></div>
  <p class="msg"></p>
  <footer><a href="https://mixtape.ru">создать свою историю →</a></footer>
</main>

<script>
  const $ = s => document.querySelector(s);
  const body = document.body;
  let ws = null, dur = 0;

  // ── применяем конфиг ──
  body.dataset.theme = ORDER.theme;
  $('.names').textContent = ORDER.names;
  $('.date').textContent = ORDER.date;
  $('.msg').textContent = ORDER.message;
  if (!ORDER.cassette) $('#cassette').style.display = 'none';
  body.classList.toggle('has-cassette', ORDER.cassette);
  body.classList.toggle('show-play', ORDER.playBtn);

  // если нет ни кассеты ни кнопки — показываем кнопку
  if (!ORDER.cassette && !ORDER.playBtn) body.classList.add('show-play');

  // если нет кнопки play — перемотку к волне
  if (!ORDER.playBtn) {
    const waveRow = $('#waveRow'), transport = $('#transport');
    waveRow.insertBefore($('#rew'), $('#wave'));
    waveRow.appendChild($('#ff'));
    transport.style.display = 'none';
  }

  const fmt = t => { t = Math.round(t || 0); return Math.floor(t/60) + ':' + String(t%60).padStart(2,'0'); };
  const themeVars = () => {
    const cs = getComputedStyle(body);
    return { wave: cs.getPropertyValue('--wave').trim(), accent: cs.getPropertyValue('--accent').trim() };
  };

  // ── лента ──
  const R_MIN = 12, R_MAX = 28, CY = 97, LX = 125, RX = 195;
  let curP = 0, playing = false, phase = 0;
  function tapeD(p, w){
    p = Math.max(0, Math.min(1, p || 0));
    const rl = R_MIN + (R_MAX - R_MIN) * (1 - p);
    const rr = R_MIN + (R_MAX - R_MIN) * p;
    $('#packL').setAttribute('r', rl.toFixed(2));
    $('#packR').setAttribute('r', rr.toFixed(2));
    return `M ${LX} ${(CY + rl - 1).toFixed(2)} C 145 ${(128 + w).toFixed(2)}, 175 ${(128 - w * .7).toFixed(2)}, ${RX} ${(CY + rr - 1).toFixed(2)}`;
  }
  const drawTape = w => $('#tapePath').setAttribute('d', tapeD(curP, w || 0));
  drawTape(0);
  (function loop(){
    if (playing || body.classList.contains('fast')){ phase += 0.11; drawTape(Math.sin(phase) * 1.2 + Math.sin(phase * 2.3) * 0.5); }
    requestAnimationFrame(loop);
  })();

  // ── звук кассеты ──
  let actx = null, graph = null;
  const ensureCtx = () => { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); return actx; };
  const noiseBuffer = (ctx, secs) => { const b = ctx.createBuffer(1, ctx.sampleRate * (secs || 2), ctx.sampleRate); const d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; return b; };
  const satCurve = () => { const n = 1024, c = new Float32Array(n); for (let i = 0; i < n; i++){ const x = i / n * 2 - 1; c[i] = Math.tanh(1.6 * x) / Math.tanh(1.6); } return c; };

  function playClick(bright){
    const ctx = ensureCtx(), t = ctx.currentTime;
    const len = Math.floor(ctx.sampleRate * 0.045);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (len * 0.14));
    const src = ctx.createBufferSource(); src.buffer = buf;
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = bright ? 2200 : 1400; bp.Q.value = .8;
    const g = ctx.createGain(); g.gain.value = .3;
    src.connect(bp).connect(g).connect(ctx.destination); src.start(t);
  }

  function scheduleCrackle(myGraph){
    const delay = 500 + Math.random() * 2600;
    myGraph.crackleTimer = setTimeout(() => {
      if (graph === myGraph){
        if (ORDER.filter && playing){
          const ctx = actx, t = ctx.currentTime;
          const len = Math.floor(ctx.sampleRate * 0.01);
          const buf = ctx.createBuffer(1, len, ctx.sampleRate);
          const d = buf.getChannelData(0);
          for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (len * 0.35));
          const src = ctx.createBufferSource(); src.buffer = buf;
          const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 2200;
          const g = ctx.createGain(); g.gain.value = 0.018 + Math.random() * 0.02;
          src.connect(hp).connect(g).connect(ctx.destination); src.start(t);
        }
        scheduleCrackle(myGraph);
      }
    }, delay);
  }

  function stopGraph(){
    if (!graph) return;
    clearTimeout(graph.crackleTimer);
    [...graph.oscs, graph.hiss].forEach(n => { try { n.stop(); } catch(e){} });
    graph = null;
  }
  function buildGraph(el){
    const ctx = ensureCtx(); stopGraph();
    const src = ctx.createMediaElementSource(el);
    const dry = ctx.createGain(); dry.gain.value = ORDER.filter ? 0 : 1;
    const wet = ctx.createGain(); wet.gain.value = ORDER.filter ? 1 : 0;
    const hp = ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=110;
    const lp = ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=7200; lp.Q.value=.5;
    const pk = ctx.createBiquadFilter(); pk.type='peaking'; pk.frequency.value=2000; pk.gain.value=2; pk.Q.value=.8;
    const sh = ctx.createWaveShaper(); sh.curve = satCurve(); sh.oversample='2x';
    src.connect(dry).connect(ctx.destination);
    src.connect(hp); hp.connect(lp); lp.connect(pk); pk.connect(sh); sh.connect(wet); wet.connect(ctx.destination);
    const hiss = ctx.createBufferSource(); hiss.buffer = noiseBuffer(ctx, 3); hiss.loop = true;
    const hf1 = ctx.createBiquadFilter(); hf1.type='highpass'; hf1.frequency.value=4200;
    const hf2 = ctx.createBiquadFilter(); hf2.type='lowpass'; hf2.frequency.value=11000;
    const hg = ctx.createGain(); hg.gain.value=0;
    const hLfo = ctx.createOscillator(); hLfo.frequency.value=.35;
    const hLfoG = ctx.createGain(); hLfoG.gain.value=.003; hLfo.connect(hLfoG); hLfo.start();
    hiss.connect(hf1); hf1.connect(hf2); hf2.connect(hg); hg.connect(ctx.destination); hiss.start();
    graph = { el, dry, wet, hg, hgBase:0.011, oscs:[hLfo], hiss };
    applyFilterState();
    scheduleCrackle(graph);
  }
  function applyFilterState(){
    if (!graph) return;
    const t = actx.currentTime;
    graph.hg.gain.setTargetAtTime(ORDER.filter && playing ? graph.hgBase : 0, t, .12);
  }

  // ── перемотка ──
  let whine = null, stepInt = null, wasPlaying = false;
  function startWhine(dir){
    const ctx = ensureCtx(); stopWhine();
    const src = ctx.createBufferSource(); src.buffer = noiseBuffer(ctx); src.loop = true;
    const bp = ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value = dir > 0 ? 1100 : 850; bp.Q.value=1.4;
    const bp2 = ctx.createBiquadFilter(); bp2.type='bandpass'; bp2.frequency.value = dir > 0 ? 2600 : 2100; bp2.Q.value=2;
    const g = ctx.createGain(); g.gain.value=0;
    const lfo = ctx.createOscillator(); lfo.frequency.value = dir > 0 ? 13 : 9;
    const lg = ctx.createGain(); lg.gain.value=140; lfo.connect(lg).connect(bp.frequency); lfo.start();
    src.connect(bp).connect(g); src.connect(bp2).connect(g); g.connect(ctx.destination);
    g.gain.setTargetAtTime(0.035, ctx.currentTime, .03);
    src.start(); whine = { src, g, lfo };
  }
  function stopWhine(){
    if (!whine) return;
    whine.g.gain.setTargetAtTime(0, actx.currentTime, .04);
    const w = whine; setTimeout(() => { try { w.src.stop(); w.lfo.stop(); } catch(e){} }, 250);
    whine = null;
  }
  function holdSeek(dir){
    if (!ws) return;
    playClick(dir > 0);
    const el = ws.getMediaElement();
    wasPlaying = !el.paused;
    startWhine(dir); body.classList.add('fast');
    el.playbackRate = 4; el.play();
    if (dir < 0) stepInt = setInterval(() => { el.currentTime = Math.max(0, el.currentTime - 0.6); }, 110);
  }
  function endSeek(dir){
    if (!ws) return;
    const el = ws.getMediaElement();
    stopWhine(); body.classList.remove('fast');
    if (dir < 0){ clearInterval(stepInt); stepInt = null; }
    el.playbackRate = 1;
    if (wasPlaying) el.play(); else el.pause();
  }
  [['#rew', -1], ['#ff', 1]].forEach(([sel, dir]) => {
    const b = $(sel);
    b.addEventListener('pointerdown', e => { e.preventDefault(); holdSeek(dir); });
    ['pointerup','pointerleave','pointercancel'].forEach(ev => b.addEventListener(ev, () => endSeek(dir)));
    b.addEventListener('contextmenu', e => e.preventDefault());
  });

  // ── wavesurfer ──
  function initPlayer(){
    const t = themeVars();
    ws = WaveSurfer.create({
      container:'#wave', url: ORDER.audio, height:76,
      barWidth:2, barGap:2, barRadius:2, cursorWidth:1, normalize:true,
      waveColor:t.wave, progressColor:t.accent,
    });
    if (ORDER.filter) buildGraph(ws.getMediaElement());
    ws.on('play',  () => { playing = true;  body.classList.add('playing'); applyFilterState(); });
    ws.on('pause', () => { playing = false; body.classList.remove('playing'); drawTape(0); applyFilterState(); });
    ws.on('finish',() => { playing = false; body.classList.remove('playing'); drawTape(0); applyFilterState(); });
    ws.on('decode', d => { dur = d; $('#tot').textContent = fmt(d); });
    const onTime = t => { $('#cur').textContent = fmt(t); if (dur > 0){ curP = t / dur; if (!playing) drawTape(0); } };
    ws.on('timeupdate', onTime);
    ws.on('seeking', onTime);
  }

  const toggle = () => ws && ws.playPause();
  $('#play').onclick = toggle;
  $('#cassette').onclick = toggle;

  initPlayer();
</script>
</body>
</html>
